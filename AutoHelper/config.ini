# ============================================================
#  Cau hinh AutoHelper
#  - Dong bat dau bang # hoac ; la ghi chu (bo qua).
#  - Moi [monitor] la mot diem theo doi pixel rieng.
# ============================================================

[general]
# Chu ky quet (mili-giay). Nho hon = phan ung nhanh, ton CPU hon.
poll_interval_ms = 100


# ------------------------------------------------------------
#  VI DU 1: Theo doi thanh HP -> tu dung thuoc mau khi HP tut
# ------------------------------------------------------------
# Cach lay so lieu:
#   1) Build va chay AutoHelper.exe.
#   2) Dua chuot/quan sat diem tren thanh HP (vd khi HP con ~50%).
#   3) Dat x,y vao day (dung tool do mau, hoac nhan F10 trong app de in mau).
#   4) r,g,b = mau cua thanh HP khi con "du mau" tai diem do.
#   5) trigger=absent => khi pixel KHONG con mau do (mau tut) thi nhan phim.
[monitor]
name = HP
x = 200
y = 50
r = 190
g = 30
b = 30
tolerance = 40
key = F1
trigger = absent
cooldown_ms = 1000


# ------------------------------------------------------------
#  VI DU 2: Theo doi thanh MP -> tu dung thuoc xanh khi MP tut
# ------------------------------------------------------------
[monitor]
name = MP
x = 200
y = 70
r = 40
g = 60
b = 200
tolerance = 40
key = F2
trigger = absent
cooldown_ms = 1000


# ------------------------------------------------------------
#  VI DU 3 (tat): doi mot icon/thong bao XUAT HIEN thi nhan phim
#  Bo dau # o duoi neu muon dung. trigger=present.
