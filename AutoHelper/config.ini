# ============================================================
#  Cau hinh AutoHelper
#  - Dong bat dau bang # hoac ; la ghi chu (bo qua).
#  - Moi [monitor] la mot diem theo doi pixel rieng.
# ============================================================

[general]
# Chu ky quet (mili-giay). Nho hon = phan ung nhanh, ton CPU hon.
poll_interval_ms = 100

# --- BAM THEO CUA SO GAME (khuyen dung) ---
# window_title: chuoi con trong tieu de cua so game (khong phan biet hoa/thuong).
#   Vi du cua so ten "Vo Lam Truyen Ky - Nhan vat ABC" thi dat "Vo Lam" la du.
#   Khi dat window_title, toa do x,y cua moi [monitor] duoc hieu la TUONG DOI
#   so voi goc tren-trai vung client cua cua so -> keo cua so khong bi lech.
#   De TRONG dong nay => dung toa do man hinh tuyet doi (nhu cu).
window_title =

# capture_mode:
#   screen = tinh ra toa do man hinh roi doc (cua so phai hien ra, mac dinh).
#   window = doc truc tiep tu DC cua so (chay ca khi khong focus; nhung vai
#            game DirectX co the tra mau den -> khi do dung screen).
capture_mode = screen


# ------------------------------------------------------------
#  VI DU 1: Theo doi thanh HP -> tu dung thuoc mau khi HP tut
# ------------------------------------------------------------
# Cach lay so lieu:
#   1) Build va chay AutoHelper.exe.
#   2) Dua chuot/quan sat diem tren thanh HP (vd khi HP con ~50%).
#   3) Dat x,y vao day (dung tool do mau, hoac nhan F10 trong app de in mau).
#   4) r,g,b = mau cua thanh HP khi con "du mau" tai diem do.
#   5) trigger=absent => khi pixel KHONG con mau do (mau tut) thi nhan phim.
[monitor]
name = HP
x = 200
y = 50
r = 190
g = 30
b = 30
tolerance = 40
key = F1
trigger = absent
cooldown_ms = 1000


# ------------------------------------------------------------
#  VI DU 2: Theo doi thanh MP -> tu dung thuoc xanh khi MP tut
# ------------------------------------------------------------
[monitor]
name = MP
x = 200
y = 70
r = 40
g = 60
b = 200
tolerance = 40
key = F2
trigger = absent
cooldown_ms = 1000


# ------------------------------------------------------------
#  VI DU 3 (tat): doi mot icon/thong bao XUAT HIEN thi nhan phim
#  Bo dau # o duoi neu muon dung. trigger=present.
# ------------------------------------------------------------
# [monitor]
# name = PopUp
# x = 500
# y = 400
# r = 255
# g = 255
# b = 0
# tolerance = 25
# key = SPACE
# trigger = present
# cooldown_ms = 1500


# ============================================================
#  PHIM LAP THEO CHU KY (auto danh / auto ky nang)
#  Moi [timer] se tu nhan 1 phim lap lai sau moi interval_ms.
#  jitter_ms (tuy chon): dao ngau nhien +/- de nhip bam tu nhien hon.
# ============================================================

# VI DU: auto danh thuong - nhan phim "1" moi ~0.6s (+/-0.15s)
[timer]
name = Attack
key = 1
interval_ms = 600
jitter_ms = 150

# VI DU: tung ky nang - nhan phim "2" moi ~5s
[timer]
name = Skill2
key = 2
interval_ms = 5000
jitter_ms = 400

